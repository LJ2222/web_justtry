<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的作品集</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="root">
    <!-- 导航栏 -->
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <h1>哎我就试一下</h1>
        </div>
        <button class="menu-toggle" id="menuToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="nav" id="nav">
          <button class="nav-link active" data-page="cases">案例</button>
          <button class="nav-link" data-page="tools">工具</button>
          <button class="nav-link" data-page="about">关于</button>
        </nav>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 案例页 -->
      <div id="cases" class="page active">
        <div class="cases-container">
          <div class="projects-grid" id="projectsGrid">
            <!-- 项目会通过 JavaScript 动态加载 -->
          </div>
        </div>
      </div>

      <!-- 工具页 -->
      <div id="tools" class="page">
        <div class="tools-container">
          <div class="tools-content">
            <div class="tool-card">
              <h3>颜色转换器</h3>
              <div class="tool-body">
                <div class="input-group">
                  <label>输入颜色 (HEX 或 RGB)</label>
                  <input type="text" id="colorInput" placeholder="例如: #FF5733 或 rgb(255, 87, 51)">
                </div>

                <div class="button-group">
                  <button class="btn btn-primary" id="convertBtn">转换</button>
                  <button class="btn btn-secondary" id="clearColorBtn">清空</button>
                </div>

                <div id="colorError" class="error-message" style="display: none;"></div>

                <div class="output-group">
                  <label>转换结果</label>
                  <div id="colorOutput" style="margin-top: 10px;">
                    <div style="margin-bottom: 10px;">
                      <span>HEX: </span><input type="text" id="hexOutput" readonly style="width: 150px; padding: 5px;">
                    </div>
                    <div style="margin-bottom: 10px;">
                      <span>RGB: </span><input type="text" id="rgbOutput" readonly style="width: 200px; padding: 5px;">
                    </div>
                    <div style="margin-bottom: 10px;">
                      <span>HSL: </span><input type="text" id="hslOutput" readonly style="width: 200px; padding: 5px;">
                    </div>
                    <div style="margin-top: 15px;">
                      <span>颜色预览: </span>
                      <div id="colorPreview" style="width: 100px; height: 100px; border-radius: 8px; border: 2px solid #ddd; display: inline-block; vertical-align: middle; margin-left: 10px;"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 关于页 -->
      <div id="about" class="page">
        <div class="about-container">
          <p style="text-align: center; font-size: 1.1em; color: #000000; margin: 20px 0;">
            哎我就试一下
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
